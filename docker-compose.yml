services:
  postgres:
    image: postgres:17
    container_name: energymax-postgres
    restart: unless-stopped

    environment:
      POSTGRES_USER: energymax
      POSTGRES_PASSWORD: energymax_dev
      POSTGRES_DB: energymax

    ports:
      - "5433:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U energymax -d energymax"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data: